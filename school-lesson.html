<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>في المدرسة — حصة اللهجة الأردنية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root{
    --board:#173629;
    --board-2:#1f4535;
    --chalk:#f3efe3;
    --chalk-dim:#c9d6cc;
    --yellow:#f2c464;
    --pink:#e79789;
    --blue:#8ec4d6;
    --line: rgba(243,239,227,0.16);
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--board);
    background-image:
      repeating-linear-gradient(var(--line) 0 1px, transparent 1px 34px);
    color:var(--chalk);
    font-family:'Cairo',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .latin{font-family:'Patrick Hand',cursive; letter-spacing:.2px;}

  header.hero{
    text-align:center;
    padding:38px 20px 26px;
    border-bottom:2px dashed var(--line);
  }
  header.hero .badge{
    display:inline-block;
    font-family:'Patrick Hand',cursive;
    color:var(--yellow);
    font-size:1.05rem;
    border:2px dashed var(--yellow);
    border-radius:999px;
    padding:4px 16px;
    margin-bottom:14px;
    transform:rotate(-2deg);
  }
  header.hero h1{
    font-size:clamp(2.1rem,7vw,3.2rem);
    margin:0 0 6px;
    font-weight:800;
    color:var(--chalk);
  }
  header.hero p{
    margin:2px 0;
    color:var(--chalk-dim);
    font-size:1.05rem;
  }
  header.hero .goals{
    max-width:560px;
    margin:18px auto 0;
    text-align:right;
    background:rgba(0,0,0,.15);
    border:1px solid var(--line);
    border-radius:14px;
    padding:14px 20px;
  }
  header.hero .goals b{color:var(--yellow);}

  nav.tabs{
    position:sticky; top:0; z-index:10;
    display:flex; gap:8px; overflow-x:auto;
    padding:12px 14px; background:rgba(23,54,41,.94);
    backdrop-filter:blur(4px);
    border-bottom:1px solid var(--line);
    top:env(safe-area-inset-top,0px);
  }
  nav.tabs button{
    flex:0 0 auto;
    font-family:'Cairo',sans-serif;
    font-weight:600;
    font-size:.92rem;
    color:var(--chalk);
    background:transparent;
    border:1px solid var(--line);
    border-radius:999px;
    padding:8px 16px;
    cursor:pointer;
    white-space:nowrap;
  }
  nav.tabs button.active{
    background:var(--yellow);
    color:#173629;
    border-color:var(--yellow);
  }

  main{max-width:760px; margin:0 auto; padding:24px 16px 70px;}
  section{display:none;}
  section.active{display:block; animation:fade .25s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

  h2.section-title{
    font-size:1.5rem; margin:0 0 4px; color:var(--yellow); font-weight:800;
  }
  .section-sub{color:var(--chalk-dim); margin:0 0 20px; font-size:.95rem;}

  .card{
    background:var(--board-2);
    border:1px solid var(--line);
    border-radius:16px;
    padding:16px 18px;
    margin-bottom:14px;
  }

  .word-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  @media(max-width:420px){.word-grid{grid-template-columns:1fr;}}
  .word-card{
    background:var(--board-2); border:1px solid var(--line); border-radius:14px;
    padding:12px 14px; cursor:pointer; text-align:right; transition:border-color .15s;
  }
  .word-card:active{border-color:var(--yellow);}
  .word-card .ar{font-size:1.25rem; font-weight:700;}
  .word-card .translit{color:var(--blue); font-family:'Patrick Hand',cursive; font-size:1rem;}
  .word-card .en{color:var(--chalk-dim); font-size:.88rem;}
  .word-card .listen{float:left; font-size:1.1rem; opacity:.75;}

  .sentence{
    border-right:3px solid var(--yellow);
    padding:8px 14px; margin:10px 0; cursor:pointer;
  }
  .sentence .ar{font-size:1.15rem; font-weight:700;}
  .sentence .translit{color:var(--blue); font-family:'Patrick Hand',cursive;}
  .sentence .en{color:var(--chalk-dim); font-size:.9rem;}

  .flip{
    background:var(--board-2); border:1px solid var(--line); border-radius:14px;
    padding:14px 16px; margin-bottom:10px; cursor:pointer;
  }
  .flip .q{font-weight:700; font-size:1.1rem;}
  .flip .a{display:none; margin-top:8px; padding-top:8px; border-top:1px dashed var(--line);}
  .flip.open .a{display:block;}
  .flip .translit{color:var(--blue); font-family:'Patrick Hand',cursive; font-size:.95rem;}
  .flip .en{color:var(--chalk-dim); font-size:.85rem;}
  .flip .hint{float:left; color:var(--chalk-dim); font-size:.8rem; font-family:'Patrick Hand',cursive;}

  .chat{display:flex; flex-direction:column; gap:10px;}
  .bubble{
    max-width:80%; padding:10px 14px; border-radius:16px; cursor:pointer;
  }
  .bubble.t{align-self:flex-start; background:var(--blue); color:#0d2b21; border-bottom-left-radius:4px;}
  .bubble.s{align-self:flex-end; background:var(--pink); color:#3a1410; border-bottom-right-radius:4px;}
  .bubble .who{font-family:'Patrick Hand',cursive; font-size:.8rem; opacity:.75;}
  .bubble .ar{font-weight:700; font-size:1.05rem;}
  .bubble .translit{font-family:'Patrick Hand',cursive; font-size:.9rem;}
  .bubble .en{font-size:.82rem; opacity:.85;}

  .bag-items{display:flex; flex-wrap:wrap; gap:10px; margin:14px 0;}
  .bag-item{
    border:2px dashed var(--line); border-radius:12px; padding:10px 14px;
    cursor:pointer; text-align:center; font-size:1.6rem; user-select:none;
  }
  .bag-item small{display:block; font-family:'Patrick Hand',cursive; font-size:.72rem; color:var(--chalk-dim); margin-top:4px;}
  .bag-item.picked{border-style:solid; border-color:var(--yellow); background:rgba(242,196,100,.12);}
  .bag-box{
    min-height:70px; border:2px solid var(--yellow); border-radius:14px;
    padding:10px; display:flex; flex-wrap:wrap; gap:8px; align-items:center;
    font-size:1.4rem;
  }
  .bag-box .empty{color:var(--chalk-dim); font-family:'Patrick Hand',cursive; font-size:.9rem;}

  .miss-grid{display:flex; gap:14px; flex-wrap:wrap; font-size:2rem; margin:16px 0;}
  .miss-grid .it{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    transition:opacity .3s;
  }
  .miss-grid .it small{font-family:'Patrick Hand',cursive; font-size:.72rem; color:var(--chalk-dim);}
  .miss-grid .it.hidden{opacity:0;}
  .btnrow{display:flex; gap:10px; flex-wrap:wrap; margin-top:10px;}
  button.pill{
    font-family:'Cairo',sans-serif; font-weight:600; font-size:.9rem;
    background:transparent; color:var(--chalk); border:1px solid var(--line);
    border-radius:999px; padding:8px 16px; cursor:pointer;
  }
  button.pill.primary{background:var(--yellow); color:#173629; border-color:var(--yellow);}
  #missMsg, #cmdMsg{margin-top:10px; font-family:'Patrick Hand',cursive; color:var(--yellow); min-height:1.2em;}

  .cmd-box{
    text-align:center; padding:26px 16px; font-size:1.4rem; font-weight:700;
  }
  .cmd-box .translit{display:block; font-family:'Patrick Hand',cursive; font-size:1rem; color:var(--blue); margin-top:6px;}
  .cmd-box .en{display:block; color:var(--chalk-dim); font-size:.9rem; margin-top:2px;}

  .qa-list li{margin-bottom:12px;}
  .qa-list .ar{font-weight:700;}
  .qa-list .translit{color:var(--blue); font-family:'Patrick Hand',cursive; display:block; font-size:.92rem;}
  .qa-list .en{color:var(--chalk-dim); display:block; font-size:.85rem;}
  ul.qa-list{list-style:none; padding:0; margin:0;}

  .blank{
    background:transparent; border:none; border-bottom:2px dotted var(--yellow);
    color:var(--yellow); font-family:'Cairo',sans-serif; font-size:1rem; width:110px;
    text-align:center; padding:2px 4px;
  }
  .blank:focus{outline:none; border-bottom-color:var(--chalk);}
  .challenge-item{margin-bottom:16px;}
  .challenge-item .en{display:block; color:var(--chalk-dim); font-size:.85rem; margin-top:4px;}
  .reveal{display:none; color:var(--pink); font-family:'Patrick Hand',cursive; margin-top:4px;}
  .reveal.show{display:block;}

  .hw-list{margin:0; padding-right:20px;}
  .hw-list li{margin-bottom:8px;}
  .hw-list .translit{color:var(--blue); font-family:'Patrick Hand',cursive; display:block; font-size:.88rem;}

  .speaker{cursor:pointer;}
</style>
</head>
<body>

<header class="hero">
  <span class="badge latin">Jordanian Dialect · for kids</span>
  <h1>🎒 في المدرسة</h1>
  <p class="latin">Fil-madrase — At School</p>
  <div class="goals">
    <b>هدف الحصة:</b> بنهاية الحصة، الطفلة تقدر تحكي عن المدرسة وتستخدم جمل بسيطة زي
    «أنا بالمدرسة»، «وين الصف؟»، «بدي أكتب»، «عندي واجب».
  </div>
</header>

<nav class="tabs" id="tabs"></nav>
<main id="sections"></main>

<script>
/* ---------------- DATA ---------------- */
const vocab = [
 ["مدرسة","madrase","School"],
 ["صف","saff","Classroom"],
 ["معلّمة","mu'allme","Teacher"],
 ["طالب / طالبة","taaleb / taalebeh","Student (boy/girl)"],
 ["كتاب","ktab","Book"],
 ["دفتر","daftar","Notebook"],
 ["قلم","alam","Pen"],
 ["قلم رصاص","alam rsas","Pencil"],
 ["ممحاة","mahaayeh","Eraser"],
 ["شنطة","shanteh","School bag"],
 ["سبورة","sboora","Board"],
 ["كرسي","korsi","Chair"],
 ["طاولة","tawleh","Desk / table"],
 ["واجب","wajeb","Homework"],
 ["امتحان","imtihan","Exam"],
];

const verbs = [
 ["أكتب","aktub","I write"],
 ["أقرأ","aqra","I read"],
 ["أدرس","adrus","I study"],
 ["أرسم","arsem","I draw"],
 ["أحلّ","ahell","I solve"],
 ["أسمع","asma'","I listen"],
 ["أجاوب","ajaweb","I answer"],
 ["أسأل","as'al","I ask"],
];

const sentences = [
 ["أنا بدرس بالمدرسة.","Ana badrus bil-madrase.","I study at school."],
 ["أنا بكتب بالدفتر.","Ana baktub bid-daftar.","I write in the notebook."],
 ["أنا بقرأ الكتاب.","Ana ba'ra el-ktab.","I read the book."],
 ["أنا برسم صورة.","Ana barsem soora.","I draw a picture."],
 ["المعلّمة بتشرح الدرس.","El-mu'allme bteshrah ed-dars.","The teacher explains the lesson."],
];

const wein = [
 ["وين كتابك؟","Wein ktabek?","Where is your book?","كتابي بالشنطة.","Ktabi bish-shanteh.","My book is in the bag."],
 ["وين قلمك؟","Wein alamek?","Where is your pen?","قلمي عالطاولة.","Alami 'al-tawleh.","My pen is on the table."],
 ["وين الممحاة؟","Wein el-mahaayeh?","Where is the eraser?","الممحاة جنب القلم.","El-mahaayeh janb el-alam.","The eraser is next to the pen."],
 ["وين المعلمة؟","Wein el-mu'allme?","Where is the teacher?","المعلمة بالصف.","El-mu'allme bis-saff.","The teacher is in the classroom."],
 ["وين الشنطة؟","Wein esh-shanteh?","Where is the bag?","الشنطة تحت الكرسي.","Esh-shanteh taht el-korsi.","The bag is under the chair."],
];

const bagItems = [
 ["📖","كتاب","ktab","book"],
 ["📓","دفتر","daftar","notebook"],
 ["✏️","قلم","alam","pen"],
 ["🧽","ممحاة","mahaayeh","eraser"],
 ["🎨","علبة ألوان","ilbet alwan","box of colors"],
];

const dialogue = [
 ["t","المعلمة","صباح الخير!","Sabah el-kheir!","Good morning!"],
 ["s","الطفلة","صباح النور!","Sabah en-noor!","Good morning! (reply)"],
 ["t","المعلمة","شو اسمك؟","Shu ismek?","What's your name?"],
 ["s","الطفلة","اسمي ______.","Ismi ______.","My name is ______."],
 ["t","المعلمة","هاي شنطتك؟","Hay shantetek?","Is this your bag?"],
 ["s","الطفلة","آه، هاي شنطتي.","Aah, hay shanteti.","Yes, this is my bag."],
 ["t","المعلمة","شو معك بالشنطة؟","Shu ma'ek bish-shanteh?","What do you have in the bag?"],
 ["s","الطفلة","معي كتاب ودفتر وقلم.","Ma'i ktab w daftar w alam.","I have a book, a notebook, and a pen."],
 ["t","المعلمة","وين دفترك؟","Wein daftarek?","Where is your notebook?"],
 ["s","الطفلة","دفتري بالشنطة.","Daftari bish-shanteh.","My notebook is in the bag."],
 ["t","المعلمة","طيب، افتحي الكتاب.","Tayeb, iftahi el-ktab.","Okay, open the book."],
 ["s","الطفلة","حاضر!","Hader!","Okay / sure!"],
 ["t","المعلمة","اكتبي اسمك.","Ektebi ismek.","Write your name."],
 ["s","الطفلة","حاضر!","Hader!","Okay / sure!"],
];

const missItems = [
 ["📖","كتاب"],["✏️","قلم"],["🧽","ممحاة"],["📓","دفتر"],["🎨","ألوان"],
];

const commands = [
 ["افتحي الكتاب!","Iftahi el-ktab!","Open the book!"],
 ["سكري الكتاب!","Sakkeri el-ktab!","Close the book!"],
 ["خدي القلم!","Khedi el-alam!","Take the pen!"],
 ["حطي القلم عالطاولة!","Hotti el-alam 'al-tawleh!","Put the pen on the table!"],
 ["افتحي الدفتر!","Iftahi ed-daftar!","Open the notebook!"],
 ["اكتبي اسمك!","Ektebi ismek!","Write your name!"],
 ["ارسمي نجمة!","Ersemi nejmeh!","Draw a star! ⭐"],
];

const convoQs = [
 ["بتحبي المدرسة؟","Bthebbi el-madrase?","Do you like school?"],
 ["شو أكتر مادة بتحبيها؟","Shu aktar madde bthebbeeha?","What's your favorite subject?"],
 ["مين معلمتك المفضلة؟","Meen mu'allemtek el-mfaddaleh?","Who's your favorite teacher?"],
 ["شو بتحطي بشنطتك؟","Shu bthotti bi-shantetek?","What do you put in your bag?"],
 ["بتحبي الرسم؟","Bthebbi er-rasem?","Do you like drawing?"],
 ["بتحبي القراءة؟","Bthebbi el-qraye?","Do you like reading?"],
 ["عندك واجب اليوم؟","Andek wajeb el-yom?","Do you have homework today?"],
 ["شو بتعملي بالاستراحة؟","Shu bta'mali bil-istraha?","What do you do at break time?"],
 ["مع مين بتلعبي بالمدرسة؟","Ma' meen btel'abi bil-madrase?","Who do you play with at school?"],
 ["شو أحلى إشي بالمدرسة؟","Shu ahla eshi bil-madrase?","What's the best thing about school?"],
 ["★ لو إنتِ المعلمة ليوم واحد، شو بتعملي؟","Law inti el-mu'allme le-yom wahed, shu bta'mali?","If you were the teacher for one day, what would you do?"],
];

const challenge = [
 ["أنا بروح على ______.","I go to ______."],
 ["أنا بكتب بـ ______.","I write with ______."],
 ["أنا بقرأ ______.","I read ______."],
 ["قلمي ______ الطاولة.","My pen is ______ the table."],
 ["كتابي ______ الشنطة.","My book is ______ the bag."],
 ["المعلمة ______ الدرس.","The teacher ______ the lesson."],
];

const homework = [
 ["هاي شنطتي.","Hay shanteti.","This is my bag."],
 ["فيها كتاب.","Feeha ktab.","It has a book."],
 ["فيها دفتر.","Feeha daftar.","It has a notebook."],
 ["فيها قلم.","Feeha alam.","It has a pen."],
 ["فيها ممحاة.","Feeha mahaayeh.","It has an eraser."],
 ["أنا بحب شنطتي.","Ana bhebb shanteti.","I love my bag."],
];

/* ---------------- SPEECH ---------------- */
function say(text){
  try{
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ar-JO';
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------------- RENDER HELPERS ---------------- */
function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html!==undefined) e.innerHTML = html;
  return e;
}

/* ---------------- SECTIONS ---------------- */
const tabDefs = [
  {id:'vocab', label:'📚 كلمات'},
  {id:'verbs', label:'✏️ أفعال'},
  {id:'wein', label:'🗣️ وين؟'},
  {id:'bag', label:'🎒 الشنطة'},
  {id:'role', label:'🎭 حوار'},
  {id:'games', label:'🎲 ألعاب'},
  {id:'talk', label:'💬 حكي'},
  {id:'challenge', label:'🧠 تحدي'},
  {id:'hw', label:'🏠 واجب'},
];

const tabsNav = document.getElementById('tabs');
const sectionsRoot = document.getElementById('sections');

tabDefs.forEach((t,i)=>{
  const b = el('button', i===0?'active':'', t.label);
  b.onclick = ()=> showTab(t.id);
  b.dataset.tab = t.id;
  tabsNav.appendChild(b);
});

function showTab(id){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab===id));
  document.querySelectorAll('main section').forEach(s=>s.classList.toggle('active', s.id===id));
}

/* --- Vocab --- */
(function(){
  const s = el('section',''); s.id='vocab'; s.classList.add('active');
  s.appendChild(el('h2','section-title','📚 كلمات جديدة'));
  s.appendChild(el('p','section-sub latin','New words — tap a card to hear it'));
  const grid = el('div','word-grid');
  vocab.forEach(([ar,tr,en])=>{
    const c = el('div','word-card');
    c.innerHTML = `<span class="listen">🔊</span><div class="ar">${ar}</div><div class="translit">${tr}</div><div class="en">${en}</div>`;
    c.onclick = ()=>say(ar);
    grid.appendChild(c);
  });
  s.appendChild(grid);
  sectionsRoot.appendChild(s);
})();

/* --- Verbs --- */
(function(){
  const s = el('section',''); s.id='verbs';
  s.appendChild(el('h2','section-title','✏️ أفعال مهمة'));
  s.appendChild(el('p','section-sub latin','Verbs + example sentences — tap to hear'));
  const grid = el('div','word-grid');
  verbs.forEach(([ar,tr,en])=>{
    const c = el('div','word-card');
    c.innerHTML = `<span class="listen">🔊</span><div class="ar">${ar}</div><div class="translit">${tr}</div><div class="en">${en}</div>`;
    c.onclick = ()=>say(ar);
    grid.appendChild(c);
  });
  s.appendChild(grid);
  const card = el('div','card');
  card.appendChild(el('div','', '<b>جمل:</b>'));
  sentences.forEach(([ar,tr,en])=>{
    const d = el('div','sentence');
    d.innerHTML = `<div class="ar">${ar}</div><div class="translit">${tr}</div><div class="en">${en}</div>`;
    d.onclick = ()=>say(ar);
    card.appendChild(d);
  });
  s.appendChild(card);
  sectionsRoot.appendChild(s);
})();

/* --- Wein (where) --- */
(function(){
  const s = el('section',''); s.id='wein';
  s.appendChild(el('h2','section-title','🗣️ وين؟'));
  s.appendChild(el('p','section-sub latin','Ask & answer "where" — tap a question to reveal the answer'));
  wein.forEach(([qar,qtr,qen,aar,atr,aen])=>{
    const f = el('div','flip');
    f.innerHTML = `<span class="hint">tap</span><div class="q ar">${qar}</div><div class="translit">${qtr}</div><div class="en">${qen}</div>
      <div class="a"><div class="ar">${aar}</div><div class="translit">${atr}</div><div class="en">${aen}</div></div>`;
    f.onclick = (e)=>{ f.classList.toggle('open'); say(f.classList.contains('open')? aar: qar); };
    s.appendChild(f);
  });
  sectionsRoot.appendChild(s);
})();

/* --- Bag --- */
(function(){
  const s = el('section',''); s.id='bag';
  s.appendChild(el('h2','section-title','🎒 شو معك بالشنطة؟'));
  s.appendChild(el('p','section-sub latin','What do you have in your bag? Tap items to pack them'));
  const items = el('div','bag-items');
  const box = el('div','bag-box');
  box.appendChild(el('span','empty','الشنطة فاضية... 🎒'));
  bagItems.forEach(([emoji,ar,tr,en])=>{
    const it = el('div','bag-item', `${emoji}<small>${ar}</small><small class="latin">${tr}</small>`);
    it.onclick = ()=>{
      it.classList.toggle('picked');
      say(`معي ${ar}`);
      renderBox();
    };
    items.appendChild(it);
  });
  s.appendChild(items);
  s.appendChild(box);
  function renderBox(){
    const picked = [...items.querySelectorAll('.picked')];
    box.innerHTML='';
    if(picked.length===0){ box.appendChild(el('span','empty','الشنطة فاضية... 🎒')); return; }
    picked.forEach(p=> box.appendChild(el('span','', p.textContent.slice(0,2))) );
  }
  const card = el('div','card');
  card.innerHTML = `<b>سؤال:</b> معك لعبة؟ <span class="latin" style="color:var(--blue)">Ma'ek li'beh?</span> — <span style="color:var(--chalk-dim)">Do you have a toy?</span><br>
  آه، معي لعبة. / لا، ما معي. <span class="latin" style="color:var(--blue)">Aah, ma'i li'beh. / La, ma ma'i.</span><br>
  <span style="color:var(--chalk-dim)">Yes, I have a toy. / No, I don't.</span>`;
  s.appendChild(card);
  sectionsRoot.appendChild(s);
})();

/* --- Role play --- */
(function(){
  const s = el('section',''); s.id='role';
  s.appendChild(el('h2','section-title','🎭 أول يوم بالمدرسة'));
  s.appendChild(el('p','section-sub latin','First day at school — tap a bubble to hear it'));
  const chat = el('div','chat');
  dialogue.forEach(([who,name,ar,tr,en])=>{
    const b = el('div','bubble '+who);

/* --- Games --- */
(function(){
  const s = el('section',''); s.id='games';
  s.appendChild(el('h2','section-title','🎲 ألعاب'));

  const c1 = el('div','card');
  c1.innerHTML = `<b>شو ناقص؟</b> <span class="latin" style="color:var(--blue)">Shu na'es?</span> — <span style="color:var(--chalk-dim)">What's missing?</span>
  <div class="section-sub latin" style="margin-top:6px;">Look, then tap "hide one" and guess what disappeared</div>`;
  const grid = el('div','miss-grid');
  let hiddenIdx = -1;
  missItems.forEach(([emoji,ar],i)=>{
    const it = el('div','it', `<span>${emoji}</span><small>${ar}</small>`);
    it.dataset.i = i;
    grid.appendChild(it);
  });
  c1.appendChild(grid);
  const row1 = el('div','btnrow');
  const hideBtn = el('button','pill primary','خبّي واحد 🙈');
  const revealBtn = el('button','pill','بيّني الجواب');
  row1.appendChild(hideBtn); row1.appendChild(revealBtn);
  c1.appendChild(row1);
  const msg1 = el('div','',''); msg1.id='missMsg';
  c1.appendChild(msg1);
  hideBtn.onclick = ()=>{
    [...grid.children].forEach(c=>c.classList.remove('hidden'));
    hiddenIdx = Math.floor(Math.random()*missItems.length);
    grid.children[hiddenIdx].classList.add('hidden');
    msg1.textContent = 'شو ناقص؟ (What is missing?)';
  };
  revealBtn.onclick = ()=>{
    if(hiddenIdx<0){ msg1.textContent='دوس "خبّي واحد" أول! (Hide one first!)'; return; }
    msg1.textContent = `الجواب: ${missItems[hiddenIdx][1]} ناقص! (The ${missItems[hiddenIdx][1]} is missing!)`;
  };
  s.appendChild(c1);

  const c2 = el('div','card');
  c2.innerHTML = `<b>لعبة الأوامر</b> <span class="latin" style="color:var(--blue)">Li'bet el-awamer</span> — <span style="color:var(--chalk-dim)">Commands game — act it out!</span>`;
  const cmdBox = el('div','cmd-box');
  cmdBox.innerHTML = `<span class="latin">دوسي "أمر جديد" للبداية</span>`;
  c2.appendChild(cmdBox);
  const row2 = el('div','btnrow');
  const nextCmd = el('button','pill primary','أمر جديد 🏃');
  row2.appendChild(nextCmd);
  c2.appendChild(row2);
  nextCmd.onclick = ()=>{
    const [ar,tr,en] = commands[Math.floor(Math.random()*commands.length)];
    cmdBox.innerHTML = `${ar}<span class="translit">${tr}</span><span class="en">${en}</span>`;
    say(ar);
  };
  s.appendChild(c2);

  sectionsRoot.appendChild(s);
})();

/* --- Conversation --- */
(function(){
  const s = el('section',''); s.id='talk';
  s.appendChild(el('h2','section-title','💬 أسئلة للمحادثة'));

/* --- Challenge --- */
(function(){
  const s = el('section',''); s.id='challenge';
  s.appendChild(el('h2','section-title','🧠 Challenge — كمّلي الجملة'));
  s.appendChild(el('p','section-sub latin','Complete the sentence, then tap "show answer"'));
  const answers = ["المدرسة","بالقلم","الكتاب","عال / تحت","بال / جوا","بتشرح"];
  challenge.forEach(([ar,en],i)=>{
    const parts = ar.split('______');
    const c = el('div','card challenge-item');
    c.innerHTML = `<div>${parts[0]}<input class="blank" placeholder="?">${parts[1]||''}</div><span class="en">${en}</span>
      <div class="reveal" id="rev${i}">✅ ${answers[i]}</div>`;
    const btn = el('button','pill','بيّني الجواب');
    btn.onclick = ()=> document.getElementById('rev'+i).classList.toggle('show');
    c.appendChild(btn);
    s.appendChild(c);
  });
  sectionsRoot.appendChild(s);
})();

(function(){
  const s = el('section',''); s.id='hw';
  s.appendChild(el('h2','section-title','🏠 Homework'));

    li.style.cursor='pointer';
    li.onclick = ()=>say(ar);
    ul.appendChild(li);
  });
  card.appendChild(ul);
  s.appendChild(card);
  sectionsRoot.appendChild(s);
})();
